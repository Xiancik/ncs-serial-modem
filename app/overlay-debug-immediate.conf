# TEMPORARY bring-up debug: flush logs synchronously so we see boot progress /
# fault dumps on RTT (deferred mode hides early crashes). Remove after triage.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_BOOT_BANNER=y
CONFIG_NRF_MODEM_LIB_LOG_LEVEL_DBG=y

# Serial Modem modules at DBG: logs AT-command handling and (with the rx hexdump
# added in sm_uart_handler.c) every byte arriving from the nRF54L15 host, so RTT
# shows whether the host's `AT` actually reaches the modem. Remove after triage.
CONFIG_SM_LOG_LEVEL_DBG=y
